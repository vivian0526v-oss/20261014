<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!-- 設定文件編碼，確保繁體中文正常顯示 -->
  <meta charset="UTF-8" />

  <!-- 讓電腦、平板與手機使用正確的響應式縮放比例 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- 設定瀏覽器分頁標題 -->
  <title>p5.js 簡易指令練習測驗</title>

  <!-- 預先連線至 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <!-- 預先連線至 Google Fonts 的字型檔伺服器 -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- 載入指定的英文與繁體中文字型 -->
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=LXGW+WenKai+Mono+TC&display=swap" rel="stylesheet" />

  <!-- 載入 p5.js 程式庫 -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>

  <!-- 載入主要測驗程式；defer 讓 HTML 先完成解析 -->
  <script src="sketch.js" defer></script>

  <style>
    /* 讓整個頁面佔滿瀏覽器視窗，並避免頁面捲動影響全螢幕畫布 */
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #e3d5ca;
    }

    /* 設定網頁介面使用指定的繁體中文字型 */
    body {
      font-family: "LXGW WenKai Mono TC", monospace;
    }

    /* 移除 p5.js 畫布可能產生的底部空白 */
    canvas {
      display: block;
    }

    /* 設定 p5.js 建立的按鈕使用指定的中文字型與觸控行為 */
    button {
      font-family: "LXGW WenKai Mono TC", monospace !important;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <!-- p5.js 會在此頁面自動建立全螢幕畫布與按鈕 -->
</body>
</html>
